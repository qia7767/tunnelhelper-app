[package]
name = "tunnel-helper-server"
version = "0.2.1"
description = "Headless browser-based Tunnel Helper server"
authors = ["Ro"]
edition = "2021"

[[bin]]
name = "tunnel-helper"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
if-addrs = "0.14"
mime_guess = "2"
rand = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }
tray-icon = "0.24"
ico = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
