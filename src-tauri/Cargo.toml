[package]
name = "tunnel-helper"
version = "0.2.0"
description = "Portable SSH tunnel helper"
authors = ["Ro"]
edition = "2021"

[[bin]]
name = "tunnel-helper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
